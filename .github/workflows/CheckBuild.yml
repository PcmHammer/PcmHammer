name: CheckBuild

on: [ pull_request, push ]

jobs:

  Kernels:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Update Package Repository
      run: sudo apt-get update

    - name: Install GNU m68k Compiler and Make tool
      run: sudo apt-get install -y gcc-m68k-linux-gnu make

    - name: Create temporary artifact storage
      run: |
        mkdir TemporaryArtifactStorage
        mkdir TemporaryArtifactStorage/WindowsUnpackaged

    - name: Build C Kernels
      run: |
        cd Kernels
        #
        # The following loop is the one location that needs to be updated when adding a new C kernel.
        #
        for p in "P12 FF2000"; do
          pcm=${p%% *}
          address=${p##* }

          echo Building Kernel ":    ${pcm}"
          make -f makefile PREFIX=/usr/bin/m68k-linux-gnu- pcm=${pcm} address=${address}
          echo "    Copy-Item Kernel-${pcm}.bin to TemporaryArtifactStorage"
          cp Kernel-${pcm}.bin ../TemporaryArtifactStorage/
          echo "    Cleanup after Kernel-${pcm}"
          echo
          make clean
        done

    - name: Build Assembly Kernels and Loaders
      run: |
        cd Kernels
        #
        # Each group is required to have 3 elements in the following order
        # 1: PCM Moniker (P01 (includes P59), P04, P08, etc...)
        # 2: Kernel Base Address
        # 3: Loader Base Address or NOLOADER if a loader is not used.
        #
        for p in "P01 FF8000 NOLOADER" "P04 FF8000 FF9890" "P04_Early FF8000 NOLOADER" "P08 FFAC00 NOLOADER" "P10 FFB800 NOLOADER" "E54 FF9100 NOLOADER" "BlackBox FFC300 NOLOADER"; do
          pcm="${p%% *}";
          p="${p#* }"
          address="${p%% *}"
          p="${p#* }"
          loader="${p%% *}"

          echo "Building Kernel :    ${pcm}"
          make -f makefile-assembly PREFIX=/usr/bin/m68k-linux-gnu- pcm=${pcm} address=${address}
          echo "    Copy-Item Kernel-${pcm}.bin to TemporaryArtifactStorage"
          cp Kernel-${pcm}.bin ../TemporaryArtifactStorage/
          echo "    Cleanup after Kernel-${pcm}"
          echo
          make -f makefile-assembly clean
          #
          # Build the Loader if requested
          #
          if [ ${loader} != NOLOADER ]; then
            echo "Building Loader :    ${pcm}"
            make -f makefile-assembly PREFIX=/usr/bin/m68k-linux-gnu- pcm=${pcm} address=${loader} name=Loader
            echo "    Copy-Item Loader-${pcm}.bin to TemporaryArtifactStorage"
            cp Loader-${pcm}.bin ../TemporaryArtifactStorage/
            echo "    Cleanup after Loader-${pcm}"
            echo
            make -f makefile-assembly clean
          fi
        done

    - name: Copy kernels into WindowsUnpackaged folders
      run: |
        cp TemporaryArtifactStorage/*.bin TemporaryArtifactStorage/WindowsUnpackaged

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernels_${{github.sha}}
        path: TemporaryArtifactStorage

  PCMHammer:
    needs: Kernels

    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.1.7

    - name: Setup MSBuild Path
      uses: microsoft/setup-msbuild@v2.0.0

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Download Kernels artifact
      uses: actions/download-artifact@v4.1.8
      with:
        name: Kernels_${{github.sha}}
        path: TemporaryArtifactStorage

    - name: Remove stale kernel artifact
      uses: geekyeggo/delete-artifact@v5.1.0
      with:
        name: Kernels_${{github.sha}}

    - name: Install Uno-Check
      run: dotnet tool install --global Uno.Check --version 1.34.1.0

    - name: Run Uno-Check to install dependencies
      run: uno-check -v --ci --non-interactive --fix --skip vswin --skip androidemulator --skip androidsdk

    - name: Install any missing workloads
      run: dotnet workload restore Apps/PcmApps.sln

    - name: Restore NuGet packages
      run: nuget restore Apps/PcmApps.sln

    - name: Restore solution dependencies (for packages that require msbuild restore)
      run: msbuild Apps/PcmApps.sln /t:Restore

    - name: Build applications
      run: msbuild Apps/PcmApps.sln

    - name: Add WinForms PCM Hammer to temporary artifact storage
      run: |
        Copy-Item -Path "Apps/UI/WindowsForms/PcmHammer/bin/Debug/PcmHammer.*" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/PcmHammer/bin/Debug/*.dll" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/PcmHammer/bin/Debug/*.pdb" -Destination TemporaryArtifactStorage

    - name: Add WinForms PCM Logger to temporary artifact storage
      run: |
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/bin/Debug/PcmLogger.*" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/bin/Debug/*.dll" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/bin/Debug/*.pdb" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/*.LogProfile" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/Parameters.*.xml" -Destination TemporaryArtifactStorage

    - name: Add WinForms VPW Explorer to temporary artifact storage
      run: |
        Copy-Item -Path "Apps/UI/WindowsForms/VpwExplorer/bin/Debug/VpwExplorer.*" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/VpwExplorer/bin/Debug/*.dll" -Destination TemporaryArtifactStorage
        Copy-Item -Path "Apps/UI/WindowsForms/VpwExplorer/bin/Debug/*.pdb" -Destination TemporaryArtifactStorage

    - name: Add Uno Windows binaries to temporary artifact storage
      run: |
        Copy-Item -Recurse -Path "Apps/UI/UnoUI/PcmHacking.UnoUI/bin/Debug/net10.0-windows10.0.26100.0/*" -Destination TemporaryArtifactStorage/WindowsUnpackaged
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/*.LogProfile"     -Destination TemporaryArtifactStorage/WindowsUnpackaged
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/Parameters.*.xml" -Destination TemporaryArtifactStorage/WindowsUnpackaged

    - name: Is it all there - Default
      run: ls -l TemporaryArtifactStorage/

    - name: Is it all there - Windows
      run: ls -l TemporaryArtifactStorage/WindowsUnpackaged

    - name: Upload artifacts
      uses: actions/upload-artifact@v4.4.0
      with:
        name: PCMHacks_${{github.sha}}
        path: TemporaryArtifactStorage

