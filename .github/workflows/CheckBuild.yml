#
# Original works by ddub07 <github.com>
# 2023-01-03 - GampyG28 <github.com> major overhaul, renamed and updated.
# 2023-04-16 - GampyG28 <github.com> Added Assembly Kernels and Loaders
# 2023-07-16 - GampyG28 <github.com> Removed C Kernel builds
# 2024-09-05 - Antus <pcmhacking.net> Update actions
# 2025-11-09 - Antus <pcmhacking.net> Add P05
# 2025-11-16 - Antus <pcmhacking.net> Add P11
# 2026-04-07 - Antus <pcmhacking.net> Update dependencies
# 2026-04-10 - Antus <pcmhacking.net> Update for WinForms + Uno Windows + Uno Android
# 2026-06-18 - Antus <pcmhacking.net> E38 PPC Kernel, via source or binary distribution
# 2026-08-11 - Antus <pcmhacking.net> Delete the temp kernels artifact in its own job, after
#                                     all consumers, instead of racing them from Applications
#

name: CheckBuild

on: [ pull_request, push ]

permissions:
  contents: write   # needed to create a GitHub Release on x.x.x.x / x.x.x tags
  actions: write

jobs:

  Kernels:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Update Package Repository
      run: sudo apt-get update

    - name: Install compilers and make
      run: sudo apt-get install -y gcc-m68k-linux-gnu gcc-powerpc-linux-gnu make

    - name: Create temporary artifact storage
      run: mkdir TemporaryArtifactStorage

    - name: Build C Kernels
      run: |
        cd Kernels
        mkdir -p build
        BUILD_STEP_START=$(date +%s)
        verify_bin() {
          local file="$1"
          if [ ! -f "$file" ]; then
            echo "ERROR: $file was not created"
            exit 1
          fi
          local hash mtime
          hash=$(sha1sum "$file" | awk '{print $1}')
          mtime=$(stat -c %Y "$file")
          if [ "$mtime" -ge "$BUILD_STEP_START" ]; then
            printf "%s  sha1:%s  OK\n" "$file" "$hash"
          else
            echo "ERROR: $file is stale (mtime=$mtime < start=$BUILD_STEP_START)"
            exit 1
          fi
        }
        #
        # The following loop is the one location that needs to be updated when adding a new C kernel.
        # Add entries as: "PCM ADDRESS" - e.g. "P12 FF2000"
        # Empty list is intentional - all targets currently use the Assembly kernel build below.
        #
        for p in; do
          pcm=${p%% *}
          address=${p##* }

          echo "Building Kernel :    ${pcm}"
          make -f makefile PREFIX=/usr/bin/m68k-linux-gnu- pcm=${pcm} address=${address}
          verify_bin "build/Kernel-${pcm}.bin"
          echo "    Copy-Item build/Kernel-${pcm}.bin to TemporaryArtifactStorage"
          cp build/Kernel-${pcm}.bin ../TemporaryArtifactStorage/
          echo "    Cleanup after Kernel-${pcm}"
          echo
          make -f makefile pcm=${pcm} clean
        done

    - name: Build Assembly Kernels and Loaders
      run: |
        cd Kernels
        mkdir -p build
        BUILD_STEP_START=$(date +%s)
        verify_bin() {
          local file="$1"
          if [ ! -f "$file" ]; then
            echo "ERROR: $file was not created"
            exit 1
          fi
          local hash mtime
          hash=$(sha1sum "$file" | awk '{print $1}')
          mtime=$(stat -c %Y "$file")
          if [ "$mtime" -ge "$BUILD_STEP_START" ]; then
            printf "%s  sha1:%s  OK\n" "$file" "$hash"
          else
            echo "ERROR: $file is stale (mtime=$mtime < start=$BUILD_STEP_START)"
            exit 1
          fi
        }
        #
        # Each group is required to have 4 elements in the following order:
        # 1: PCM Moniker (P01 (includes P59), P04, P08, etc...)
        # 2: Kernel Base Address
        # 3: Loader Base Address or NOLOADER if a loader is not used.
        # 4: Source directory (68k-VPW-Asm for standard, 68k-VPW-Asm-P04 for P04)
        #
        for p in "P01 FF8000 NOLOADER 68k-VPW-Asm" "P04 FF8000 FF9890 68k-VPW-Asm-P04" "P04_Early FF8000 NOLOADER 68k-VPW-Asm" "P05 FFC100 NOLOADER 68k-VPW-Asm" "P08 FFABE0 NOLOADER 68k-VPW-Asm" "P10 FFB800 NOLOADER 68k-VPW-Asm" "P11 FFC000 NOLOADER 68k-VPW-Asm" "P12 FF2000 NOLOADER 68k-VPW-Asm" "E54 FF9100 NOLOADER 68k-VPW-Asm" "BlackBox FFC300 NOLOADER 68k-VPW-Asm"; do
          pcm="${p%% *}";
          p="${p#* }"
          address="${p%% *}"
          p="${p#* }"
          loader="${p%% *}"
          p="${p#* }"
          srcdir="${p%% *}"

          echo "Building Kernel :    ${pcm} (srcdir=${srcdir})"
          make -f makefile-assembly PREFIX=/usr/bin/m68k-linux-gnu- pcm=${pcm} address=${address} srcdir=${srcdir}
          verify_bin "build/Kernel-${pcm}.bin"
          echo "    Copy-Item build/Kernel-${pcm}.bin to TemporaryArtifactStorage"
          cp build/Kernel-${pcm}.bin ../TemporaryArtifactStorage/
          echo "    Cleanup after Kernel-${pcm}"
          echo
          make -f makefile-assembly pcm=${pcm} srcdir=${srcdir} clean
          #
          # Build the Loader if requested
          #
          if [ ${loader} != NOLOADER ]; then
            echo "Building Loader :    ${pcm} (srcdir=${srcdir})"
            make -f makefile-assembly PREFIX=/usr/bin/m68k-linux-gnu- pcm=${pcm} address=${loader} name=Loader srcdir=${srcdir}
            verify_bin "build/Loader-${pcm}.bin"
            echo "    Copy-Item build/Loader-${pcm}.bin to TemporaryArtifactStorage"
            cp build/Loader-${pcm}.bin ../TemporaryArtifactStorage/
            echo "    Cleanup after Loader-${pcm}"
            echo
            make -f makefile-assembly pcm=${pcm} name=Loader srcdir=${srcdir} clean
          fi
        done

    - name: Build remaining kernels
      run: |
        cd Kernels
        mkdir -p build
        BUILD_STEP_START=$(date +%s)
        verify_bin() {
          local file="$1"
          if [ ! -f "$file" ]; then
            echo "ERROR: $file was not created"
            exit 1
          fi
          local hash mtime
          hash=$(sha1sum "$file" | awk '{print $1}')
          mtime=$(stat -c %Y "$file")
          if [ "$mtime" -ge "$BUILD_STEP_START" ]; then
            printf "%s  sha1:%s  OK\n" "$file" "$hash"
          else
            echo "ERROR: $file is stale (mtime=$mtime < start=$BUILD_STEP_START)"
            exit 1
          fi
        }
        #
        # Some kernels are maintained in their own source directory and build with a
        # per-directory build script; when that source is not in this tree, the directory
        # carries a committed binary instead. Run any build scripts present, then fall
        # back to a committed Kernel-*.bin / Loader-*.bin left in a kernel directory that
        # has no build script (a freshly built binary always wins), then stage results.
        #
        for script in */ci-build.sh; do
          [ -e "$script" ] || continue
          echo "Building kernel(s) in $(dirname "$script")"
          bash "$script"
        done
        for dir in */; do
          dir=${dir%/}
          [ "$dir" = build ] && continue
          [ -f "$dir/ci-build.sh" ] && continue
          [ -f "$dir/BuildKernel.cmd" ] && continue
          for bin in "$dir"/Kernel-*.bin "$dir"/Loader-*.bin; do
            [ -e "$bin" ] || continue
            base=$(basename "$bin")
            if [ ! -f "build/$base" ]; then
              echo "Using committed $base from $dir"
              cp "$bin" "build/$base"
            fi
          done
        done
        for bin in build/Kernel-*.bin build/Loader-*.bin; do
          [ -e "$bin" ] || continue
          verify_bin "$bin"
          cp "$bin" ../TemporaryArtifactStorage/
        done

    - name: Upload kernels artifact
      uses: actions/upload-artifact@v7
      with:
        name: Temp_Kernels_${{github.sha}}
        path: TemporaryArtifactStorage

  # Linux command-line build. Runs on Linux (the WinForms/CLI/Uno-Windows builds need
  # Windows, so they live in the Applications job); this one only needs .NET and the
  # kernels artifact. Publishes a self-contained, single-file binary named "pcmhammer-cli"
  # with the kernels embedded in it, and uploads that single binary as the artifact.
  LinuxCLI:
    needs: Kernels
    runs-on: ubuntu-24.04
    env:
      CLI_ARTIFACT_SUFFIX: ''

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Download kernels artifact
      uses: actions/download-artifact@v8
      with:
        name: Temp_Kernels_${{github.sha}}
        path: TemporaryArtifactStorage/Kernels

    - name: Compute artifact name
      run: |
        # Match the WinForms/CLI naming: a version tag on a release, otherwise a UTC
        # stamp + sanitized branch name marking it as a development test build.
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          suffix="v${GITHUB_REF_NAME}"
        else
          stamp=$(date -u +%Y%m%d_%H%M%S)
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          branch=$(printf '%s' "$branch" | tr '/\\' '--' | tr -c 'A-Za-z0-9._-' '-')
          [ -z "$branch" ] && branch="unknown-branch"
          suffix="utc${stamp}_${branch}_development_test_version"
        fi
        echo "CLI_ARTIFACT_SUFFIX=${suffix}" >> "$GITHUB_ENV"

    - name: Stage kernels for embedding
      run: |
        # The Linux CLI embeds the kernels into the executable at build time from
        # Kernels/build. The kernels were produced by the Kernels job and downloaded to
        # TemporaryArtifactStorage/Kernels, so place them where the project expects them.
        mkdir -p Kernels/build
        cp TemporaryArtifactStorage/Kernels/*.bin Kernels/build/

    # On a release tag, stamp the version into the AssemblyInfo.cs that PcmHammerLinux.csproj
    # links from the Windows CLI, so the binary reports "Version: x.y.z" instead of the build
    # date. This job cannot use Build-Apps.ps1 (that drives msbuild on Windows), so it reuses
    # the same Get-BuildVersion rules and rewrites the same attributes that script would.
    # Note the project sets GenerateAssemblyInfo=false, so -p:Version on the publish below
    # would have no effect - the attributes have to come from this file.
    - name: Stamp version (release tag only)
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      shell: pwsh
      run: |
        . "Apps/build/Get-BuildVersion.ps1"
        $info = Get-BuildVersion -Version "${{ github.ref_name }}"
        $file = "Apps/UI/PcmHammerCLI/Properties/AssemblyInfo.cs"
        $lines = Get-Content -LiteralPath $file
        $sawInfo = $false
        $out = foreach ($line in $lines) {
          if     ($line -match '^\[assembly:\s*AssemblyVersion\(')              { "[assembly: AssemblyVersion(""$($info.Version)"")]" }
          elseif ($line -match '^\[assembly:\s*AssemblyFileVersion\(')          { "[assembly: AssemblyFileVersion(""$($info.Version)"")]" }
          elseif ($line -match '^\[assembly:\s*AssemblyInformationalVersion\(') { $sawInfo = $true; "[assembly: AssemblyInformationalVersion(""$($info.Display)"")]" }
          else { $line }
        }
        if (-not $sawInfo) { $out = @($out) + "[assembly: AssemblyInformationalVersion(""$($info.Display)"")]" }
        Set-Content -LiteralPath $file -Value $out -Encoding UTF8
        Write-Host "Stamped $($info.Version) / display $($info.Display)"

    - name: Publish Linux CLI (self-contained, single-file)
      run: >
        dotnet publish Apps/UI/PcmHammerLinux/PcmHammerLinux.csproj
        -c Release
        -r linux-x64
        --self-contained true
        -p:PublishSingleFile=true

    - name: Verify the published binary reports the expected version
      run: |
        pub=Apps/UI/PcmHammerLinux/bin/Release/net10.0/linux-x64/publish
        chmod +x "$pub/pcmhammer-cli"
        line=$("$pub/pcmhammer-cli" --help | sed -n 2p)
        echo "Version line: $line"
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # A stamped release must not fall back to the build-date line.
          case "$line" in
            Version:*) ;;
            *) echo "::error::Release build reports '$line'; expected 'Version: ...'"; exit 1 ;;
          esac
        fi

    - name: Stage Linux CLI payload
      run: |
        # The kernels are embedded in the executable, so the artifact is just the single
        # self-contained binary - no loose .bin files needed alongside it.
        dest=TemporaryArtifactStorage/LinuxCLI
        mkdir -p "$dest"
        pub=Apps/UI/PcmHammerLinux/bin/Release/net10.0/linux-x64/publish
        cp "$pub/pcmhammer-cli" "$dest/"
        chmod +x "$dest/pcmhammer-cli"

    - name: Upload Linux CLI artifact
      uses: actions/upload-artifact@v7
      with:
        name: PCMHammer_Linux_CLI_${{ env.CLI_ARTIFACT_SUFFIX }}_${{ github.sha }}
        path: TemporaryArtifactStorage/LinuxCLI

    # On a release tag, attach the binary to the GitHub Release so it is a public download
    # rather than a login-only workflow artifact. The Applications job publishes the same
    # release with the Windows assets; whichever job gets there first creates it and the
    # other uploads into it, so this is written to tolerate either order.
    - name: Publish Linux CLI to GitHub Release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        dist=dist
        mkdir -p "$dist"
        asset="$dist/PCMHammer_Linux_CLI_v${TAG}.tar.gz"
        # tar (unlike the zip format actions/upload-artifact produces) preserves the
        # executable bit, so a user extracting this does not need to chmod it first.
        # Built from inside the staging dir so the archive root is just the binary.
        tar -czf "$asset" -C TemporaryArtifactStorage/LinuxCLI pcmhammer-cli
        echo "Built asset: $asset"

        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
        else
          # Create it; if the Applications job created it in between, fall back to uploading.
          gh release create "$TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PCM Hammer $TAG" \
            --generate-notes \
          || gh release upload "$TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
        fi

  Applications:
    needs: Kernels
    runs-on: windows-2025-vs2026

    env:
      # Declared here so the linter knows these variables are valid; the empty
      # defaults are never used - the "Read app versions" step overwrites them
      # at runtime via $GITHUB_ENV before the upload steps reference them.
      WINFORMS_ARTIFACT_SUFFIX: ''
      UNO_ARTIFACT_SUFFIX: ''
      CLI_ARTIFACT_SUFFIX: ''
      PACKAGE_TOKEN: ''

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Setup Java (Android toolchain)
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Download kernels artifact
      uses: actions/download-artifact@v8
      with:
        name: Temp_Kernels_${{github.sha}}
        path: TemporaryArtifactStorage/Kernels

    - name: Inject kernels into Uno assets
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: pwsh
      run: |
        $unoSharedAssetKernelPath = "Apps/UI/UnoUI/PcmHacking.UnoUI/Assets/Kernels"
        $unoAndroidAssetKernelPath = "Apps/UI/UnoUI/PcmHacking.UnoUI/Platforms/Android/Assets/Kernels"
        New-Item -ItemType Directory -Force -Path $unoSharedAssetKernelPath | Out-Null
        New-Item -ItemType Directory -Force -Path $unoAndroidAssetKernelPath | Out-Null
        Copy-Item -Path "TemporaryArtifactStorage/Kernels/*.bin" -Destination $unoSharedAssetKernelPath -Force
        Copy-Item -Path "TemporaryArtifactStorage/Kernels/*.bin" -Destination $unoAndroidAssetKernelPath -Force

    - name: Install Uno-Check
      run: dotnet tool install --global Uno.Check --version 1.34.1.0

    - name: Run Uno-Check to install dependencies
      run: uno-check -v --ci --non-interactive --fix --skip vswin --skip androidemulator

    - name: Restore Uno workloads
      run: dotnet workload restore Apps/PcmApps.sln

    - name: Restore NuGet packages
      run: nuget restore Apps/PcmApps.sln

    - name: Restore solution dependencies (dotnet restore)
      run: dotnet restore Apps/PcmApps.sln

    - name: Ensure .NET Framework 4.6.2 Developer Pack
      run: |
        Invoke-WebRequest https://go.microsoft.com/fwlink/?linkid=2099466 -OutFile .\NDP462-DevPack-KB3151934-ENU.exe
        .\NDP462-DevPack-KB3151934-ENU.exe /passive /norestart

    - name: Determine build configuration and version
      shell: pwsh
      run: |
        # A tag push (refs/tags/*) is a release: build Release, and name everything
        # after the tag (e.g. 2.0.0 or 2.0.0.1). Any other push/PR is a development
        # build: Debug, with a UTC date-stamped name. The binaries themselves carry
        # the version committed into AssemblyInfo by Release.ps1 (CI does not stamp).
        $isReleaseTag = "${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true"
        $tag   = "${{ github.ref_name }}"
        $stamp = [DateTime]::UtcNow.ToString("yyyyMMdd_HHmmss")
        if ($isReleaseTag) {
          $config = "Release"; $token = $tag; $appVersion = $tag
        } else {
          $config = "Debug";   $token = $stamp; $appVersion = "0.0.0"
        }
        "IS_RELEASE_TAG=$isReleaseTag"    | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RELEASE_TAG=$tag"                | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "BUILD_CONFIG=$config"            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "PACKAGE_TOKEN=$token"            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "PACKAGE_APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "Release tag: $isReleaseTag  config: $config  token: $token"

    # Build the WinForms apps + CLI with msbuild (via Build-Apps.ps1) and stage them into
    # dist\staging. msbuild is required so Costura embeds the full transitive dependency closure
    # into each single exe; dotnet build does not flow transitive package deps for these legacy
    # (non-SDK) projects, which would produce runtime-incomplete single exes. Build-Apps also
    # copies the kernels next to PcmHammer and the logger profiles/parameters next to PcmLogger.
    - name: Build and stage WinForms apps + CLI
      shell: pwsh
      run: |
        # Build-Apps reads the kernels from Kernels\build; the CI kernels artifact was
        # downloaded to TemporaryArtifactStorage\Kernels, so place them where it expects.
        New-Item -ItemType Directory -Force -Path Kernels/build | Out-Null
        Copy-Item -Path "TemporaryArtifactStorage/Kernels/*.bin" -Destination "Kernels/build" -Force
        # Release tag -> stamp the tag version into the binaries; dev push -> date-stamped build.
        $versionArgs = @()
        if ($env:IS_RELEASE_TAG -eq 'True') { $versionArgs += @('-Version', $env:RELEASE_TAG) }
        & "Apps/build/Build-Apps.ps1" -Configuration $env:BUILD_CONFIG @versionArgs

    # Uno is experimental and dev-only. On a release tag it is skipped entirely so it
    # cannot be attached to (or block) the release; on normal pushes/PRs it still builds
    # and is published as experimental workflow artifacts. The same gate is applied to
    # every Uno build/stage/upload step below.
    - name: Build Uno Windows (Debug)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: dotnet build Apps/UI/UnoUI/PcmHacking.UnoUI/PcmHacking.UnoUI.csproj -c Debug -f net10.0-windows10.0.26100.0

    - name: Publish Uno Android (Release APK)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: >
        dotnet publish Apps/UI/UnoUI/PcmHacking.UnoUI/PcmHacking.UnoUI.csproj
        -c Release
        -f net10.0-android
        -p:AndroidPackageFormat=apk
        -p:EmbedAssembliesIntoApk=true

    - name: Compute artifact names
      shell: pwsh
      run: |
        # WinForms + CLI artifacts are named after the git tag on a release (e.g. v2.0.0);
        # development builds use a UTC stamp + branch name. The Uno (experimental) artifacts
        # take their version from the Uno csproj (set by Release.ps1).
        [xml]$uno = Get-Content "Apps/UI/UnoUI/PcmHacking.UnoUI/PcmHacking.UnoUI.csproj"
        $unoDisplay = ($uno.Project.PropertyGroup | Where-Object { $_.ApplicationDisplayVersion } | Select-Object -First 1).ApplicationDisplayVersion
        $unoVersion = ($uno.Project.PropertyGroup | Where-Object { $_.ApplicationVersion } | Select-Object -First 1).ApplicationVersion

        $isReleaseTag = ($env:IS_RELEASE_TAG -eq "True")
        $timestampUtc = [DateTime]::UtcNow.ToString("yyyyMMdd_HHmmss")
        $unoLooksUnversioned = ($unoDisplay -eq "0.0.0.0")
        $branchNameRaw = if ([string]::IsNullOrWhiteSpace($env:GITHUB_HEAD_REF)) { $env:GITHUB_REF_NAME } else { $env:GITHUB_HEAD_REF }
        $branchNameSafe = $branchNameRaw -replace '[\\/]', '-'
        $branchNameSafe = $branchNameSafe -replace '[^A-Za-z0-9._-]', '-'
        if ([string]::IsNullOrWhiteSpace($branchNameSafe)) { $branchNameSafe = "unknown-branch" }
        $devSuffix = "utc$timestampUtc" + "_" + $branchNameSafe + "_development_test_version"

        if ($isReleaseTag) {
          $winFormsArtifactSuffix = "v$env:RELEASE_TAG"
        } else {
          $winFormsArtifactSuffix = $devSuffix
        }

        if ($isReleaseTag -and -not $unoLooksUnversioned -and -not [string]::IsNullOrWhiteSpace($unoDisplay) -and -not [string]::IsNullOrWhiteSpace($unoVersion)) {
          $unoArtifactSuffix = "v$unoDisplay.$unoVersion"
        } else {
          $unoArtifactSuffix = $devSuffix
        }

        # CLI shares the same version as WinForms since they are built from the same codebase.
        $cliArtifactSuffix = $winFormsArtifactSuffix

        "UNO_DISPLAY_VERSION=$unoDisplay" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "UNO_APP_VERSION=$unoVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "WINFORMS_ARTIFACT_SUFFIX=$winFormsArtifactSuffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "UNO_ARTIFACT_SUFFIX=$unoArtifactSuffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CLI_ARTIFACT_SUFFIX=$cliArtifactSuffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Stage Uno Windows artifact payload
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: pwsh
      run: |
        $unoWindowsOutput = Get-ChildItem -Path "Apps/UI/UnoUI/PcmHacking.UnoUI/bin" -Recurse -File -ErrorAction SilentlyContinue `
          | Where-Object {
              ($_.Name -like "pcm*.exe" -or $_.Name -like "pcm*.dll") -and
              $_.FullName -like "*net10.0-windows*"
            } `
          | Sort-Object FullName `
          | Select-Object -First 1

        if (!$unoWindowsOutput) {
          throw "Uno Windows output file (pcm*.exe or pcm*.dll) not found under Apps/UI/UnoUI/PcmHacking.UnoUI/bin"
        }

        New-Item -ItemType Directory -Force -Path TemporaryArtifactStorage/UnoWindows | Out-Null
        Copy-Item -Path "TemporaryArtifactStorage/Kernels/*.bin" -Destination "TemporaryArtifactStorage/UnoWindows" -Force
        Copy-Item -Path "$($unoWindowsOutput.Directory.FullName)/*" -Destination "TemporaryArtifactStorage/UnoWindows" -Recurse -Force
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/*.LogProfile" -Destination "TemporaryArtifactStorage/UnoWindows" -Force
        Copy-Item -Path "Apps/UI/WindowsForms/PcmLogger/Parameters.*.xml" -Destination "TemporaryArtifactStorage/UnoWindows" -Force

    - name: Stage Uno Android artifact payload
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: pwsh
      run: |
        $androidBinRoot = (Resolve-Path "Apps/UI/UnoUI/PcmHacking.UnoUI/bin").Path
        $androidApks = Get-ChildItem -Path $androidBinRoot -Recurse -File -Filter "*.apk" -ErrorAction SilentlyContinue `
          | Where-Object { $_.FullName -like "*net10.0-android*" }

        if (!$androidApks -or $androidApks.Count -eq 0) {
          throw "Uno Android APK files not found under Apps/UI/UnoUI/PcmHacking.UnoUI/bin"
        }

        New-Item -ItemType Directory -Force -Path TemporaryArtifactStorage/UnoAndroid | Out-Null

        # Prefer a signed/unsigned pair when available; otherwise include all APKs found.
        $signedApk = $androidApks | Where-Object { $_.Name -match "(?i)signed" } | Select-Object -First 1
        $unsignedApk = $androidApks | Where-Object { $_.Name -match "(?i)unsigned" } | Select-Object -First 1

        $apkSelection = @()
        if ($signedApk) { $apkSelection += $signedApk }
        if ($unsignedApk) { $apkSelection += $unsignedApk }
        if ($apkSelection.Count -eq 0) { $apkSelection = $androidApks }

        Add-Type -AssemblyName System.IO.Compression.FileSystem
        foreach ($apk in ($apkSelection | Sort-Object FullName -Unique)) {
          $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
          try {
            $kernelEntries = $zip.Entries | Where-Object {
              $_.FullName -like "assets/Kernel-*.bin" -or
              $_.FullName -like "assets/Loader-*.bin" -or
              $_.FullName -like "assets/Kernels/Kernel-*.bin" -or
              $_.FullName -like "assets/Kernels/Loader-*.bin"
            }
            if (!$kernelEntries -or $kernelEntries.Count -eq 0) {
              throw "APK '$($apk.Name)' does not contain kernel assets."
            }

            # Android packaging can vary across SDK/toolchain versions:
            # - classic managed assemblies (*.dll)
            # - AOT outputs (libaot-*.dll.so)
            # - native-style outputs (lib*.so) for app-specific assemblies
            # - assembly store payloads (assemblies/*.blob or assemblies/*.dll)
            $appAssemblyEntries = $zip.Entries | Where-Object {
              $_.FullName -match '(?i)(PcmHacking|PcmLibrary|net[._]PcmHacking[._]Uno).*(\.dll(\.so)?$|\.so$)' -or
              $_.FullName -match '(?i)^assemblies/.*\.(blob|dll|manifest)$'
            }
            if (!$appAssemblyEntries -or $appAssemblyEntries.Count -eq 0) {
              $diagnosticEntries = $zip.Entries |
                Where-Object { $_.FullName -match "(?i)(\\.dll|\\.so|\\.blob|assemblies/)" } |
                Select-Object -ExpandProperty FullName -First 60
              if ($diagnosticEntries) {
                Write-Host "APK payload diagnostics for '$($apk.Name)':"
                $diagnosticEntries | ForEach-Object { Write-Host "  $_" }
              }
              throw "APK '$($apk.Name)' does not contain expected app payload entries."
            }
          }
          finally {
            $zip.Dispose()
          }

          Copy-Item -Path $apk.FullName -Destination "TemporaryArtifactStorage/UnoAndroid" -Force
        }

    # --- Package the WinForms apps into the installer + portable, in this same job, so
    #     no redundant intermediate (raw WinForms/CLI) artifacts are published.
    #     PACKAGE_TOKEN / PACKAGE_APP_VERSION are set by the
    #     "Determine build configuration and version" step above. ---
    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --no-progress -y

    - name: Build installer + portable
      shell: pwsh
      run: |
        $staging = (Resolve-Path "dist/staging").Path   # produced by Build-Apps.ps1; has WinForms\ and CLI\
        $dist = Join-Path (Get-Location).Path "dist"
        & "Apps/installer/build-installer.ps1" `
          -StagingRoot $staging -Version $env:PACKAGE_APP_VERSION `
          -SetupName "PCMHammer_$($env:PACKAGE_TOKEN)_Setup" -OutputDir $dist
        & "Apps/build/Build-Portable.ps1" `
          -StagingRoot $staging -OutputName "PCMHammer_$($env:PACKAGE_TOKEN)_Portable" -OutputDir $dist

    # GitHub lists run artifacts alphabetically: Linux_CLI (from the LinuxCLI job), then
    # Portable, Setup, Uno_Android, Uno_Windows.
    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: PCMHammer_Setup_${{ env.WINFORMS_ARTIFACT_SUFFIX }}_${{ github.sha }}
        path: dist/PCMHammer_*_Setup.exe

    # Upload the unzipped portable tree (the folder, not the .zip). upload-artifact always
    # zips its input, so handing it the pre-made .zip would produce a zip-inside-a-zip;
    # handing it the folder yields a single wrapping zip whose root is PCMHammer\ (the same
    # way the Setup artifact is a single zip around the .exe). The .zip Build-Portable also
    # produced is reserved for the GitHub Release asset below.
    - name: Upload portable artifact
      uses: actions/upload-artifact@v7
      with:
        name: PCMHammer_Portable_${{ env.WINFORMS_ARTIFACT_SUFFIX }}_${{ github.sha }}
        path: dist/PCMHammer_${{ env.PACKAGE_TOKEN }}_Portable

    - name: Upload Uno Android artifact (experimental)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7
      with:
        name: PCMHammer_Uno_Android_experimental_${{ env.UNO_ARTIFACT_SUFFIX }}_${{ github.sha }}
        path: TemporaryArtifactStorage/UnoAndroid

    - name: Upload Uno Windows artifact (experimental)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v7
      with:
        name: PCMHammer_Uno_Windows_experimental_${{ env.UNO_ARTIFACT_SUFFIX }}_${{ github.sha }}
        path: TemporaryArtifactStorage/UnoWindows

    # On an x.x.x / x.x.x.x tag push, publish a GitHub Release and attach the WinForms
    # installer + portable zip (the public, supported downloads). The Uno targets are
    # experimental and are intentionally NOT attached - they remain only as workflow
    # run-artifacts above. Re-running on an existing tag updates the assets in place.
    - name: Publish GitHub Release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $assets = Get-ChildItem dist -File |
          Where-Object { $_.Name -match 'PCMHammer_.*_(Setup\.exe|Portable\.zip)$' } |
          ForEach-Object { $_.FullName }
        if (-not $assets) { throw "No release assets (Setup.exe / Portable.zip) found in dist/" }
        Write-Host "Releasing tag '$env:RELEASE_TAG' with assets:"
        $assets | ForEach-Object { Write-Host "  $_" }

        gh release view "$env:RELEASE_TAG" --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release exists - uploading/replacing assets."
          gh release upload "$env:RELEASE_TAG" $assets --clobber --repo $env:GITHUB_REPOSITORY
        } else {
          Write-Host "Creating new release."
          gh release create "$env:RELEASE_TAG" $assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "PCM Hammer $env:RELEASE_TAG" `
            --generate-notes
        }
        if ($LASTEXITCODE -ne 0) { throw "gh release step failed (exit $LASTEXITCODE)" }

  # Temp_Kernels_<sha> is an intermediate handoff from the Kernels job, consumed by every
  # job that needs the kernels; it is not something anyone should download from the run
  # summary, so it is deleted once it is no longer needed. That deletion lives here, in a
  # job gated on ALL of its consumers, rather than inside a consumer: the consumers run in
  # parallel, so a consumer that deleted the shared artifact would race the others and
  # intermittently break whichever one had not downloaded it yet.
  #
  # Any future job that downloads Temp_Kernels_<sha> must be added to "needs" below.
  #
  # always() so the artifact is still cleaned up when a consumer fails or is cancelled.
  # This job deliberately does not fail the run - a leftover temp artifact expires on its
  # own and is not worth turning a good build red over.
  CleanupKernelsArtifact:
    needs: [ Kernels, LinuxCLI, Applications ]
    if: always()
    runs-on: ubuntu-24.04

    steps:
    - name: Remove temporary kernels artifact
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const run_id = context.runId;
          const targetName = `Temp_Kernels_${context.sha}`;
          const artifacts = await github.paginate(
            github.rest.actions.listWorkflowRunArtifacts,
            { owner, repo, run_id, per_page: 100 }
          );
          const matches = artifacts.filter(a => a.name === targetName);
          if (matches.length === 0) {
            core.info(`No artifact named ${targetName} to delete.`);
          }
          for (const artifact of matches) {
            core.info(`Deleting temporary artifact ${artifact.name} (${artifact.id})`);
            await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
          }
